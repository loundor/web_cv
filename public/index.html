<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV - Développeur Système & Embarqué</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Background Pattern -->
    <div class="background-pattern"></div>

    <!-- Main Card Container -->
    <div class="card-container">
        <!-- Left Panel Card -->
        <aside class="card-left">
            <div class="profile-section">
                <!-- Chargé dynamiquement -->
            </div>

            <div class="social-section">
                <!-- Chargé dynamiquement -->
            </div>

            <a href="#" class="download-cv-btn">
                <!-- Chargé dynamiquement -->
            </a>
        </aside>

        <!-- Right Panel Card -->
        <main class="card-right" id="main-content">
            <!-- Sections chargées dynamiquement -->
        </main>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <!-- Section Icons -->
        <div class="nav-icons">
            <!-- Chargé dynamiquement -->
        </div>

        <!-- Arrow Navigation -->
        <div class="nav-arrows">
            <button class="arrow-btn" id="prevBtn">
                <i class="fas fa-chevron-left"></i>
            </button>
            <button class="arrow-btn" id="nextBtn">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>

    <!-- Scripts modulaires -->
    <script src="/js/language-manager.js"></script>
    <script src="/js/data-loader.js"></script>
    <script src="/js/renderer.js"></script>
    <script src="/js/navigation.js"></script>
    <script src="script.js"></script>
</body>
</html>
